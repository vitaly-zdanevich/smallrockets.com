<HTML>
<HEAD>
<TITLE>Concentration</TITLE>
<SCRIPT LANGUAGE="JavaScript">
var BOARD_WIDTH = 6;
var BOARD_HEIGHT = 4;
var BOARD_SIZE = BOARD_WIDTH * BOARD_HEIGHT;
var MYNULL = 1000;
var GAME_OVER = 0;
var GAME_RUNNING = 1;
var gameState = GAME_RUNNING;
var tiles = new Array(BOARD_SIZE);
var moveCount = 0;
var closeTimer;
var loadedImageCount = 0;
var firstSelected, secondSelected;
function displayInformation(pageURL)
{
 window.open(pageURL,"information","width=300,height=350,toolbar=no,scrollbars=yes,status=no,menubar=no");
}
function start()
{
 gameState = GAME_OVER;
 boardReset();
}
function restart()
{
 if (gameState == GAME_RUNNING)
 {
 var msg = "You are currently playing a game. Are you sure you want to restart?";
 if (confirm(msg))
 {
 moveCount = 0;
 clearTimeout(closeTimer);
 gameState = GAME_OVER;
 boardReset();
 }
 }
 else
 {
 clearTimeout(closeTimer);
 moveCount = 0;
 boardReset();
 }
}
function boardReset()
{
 var pair = 1;
 var square1, square2, tempNumber;
 document.output.display.value = "Choose a tile!";
 for (i = 0; i < BOARD_SIZE; i += 2)
 {
 tiles[i] = pair;
 tiles[i + 1] = pair;
 pair++;
 }
 for (i = 0; i < 100; i++)
 {
 square1 = Math.round(parseInt(Math.random() * BOARD_SIZE));
 square2 = Math.round(parseInt(Math.random() * BOARD_SIZE));
 tempNumber = tiles[square1];
 tiles[square1] = tiles[square2];
 tiles[square2] = tempNumber;
 }
 if (gameState == GAME_OVER)
 {
 for (i = 0; i < BOARD_HEIGHT; i++)
 {
 for (j = 0; j < BOARD_WIDTH; j++)
 {
 eval("document.tiles" + ((BOARD_WIDTH * i) + j) + ".src=\"images/pi_close.gif\";");
 }
 }
 }
 gameState = GAME_RUNNING;
 firstSelected = MYNULL;
 secondSelected = MYNULL;
}
function makeMove(currentMove)
{
 var moveMade = 0;
 if ((tiles[currentMove] != 'x') && (currentMove != firstSelected))
 {
 if (firstSelected != MYNULL && secondSelected != MYNULL && moveMade == 0)
 {
 clearTimeout(closeTimer);
 resetTiles(firstSelected, secondSelected);
 firstSelected = currentMove;
 secondSelected = MYNULL;
 moveMade = 1;
 eval("document.tiles" + currentMove + ".src = \"images/tower/tile" + tiles[currentMove] + ".gif\";");
 }
 if (firstSelected != MYNULL && secondSelected == MYNULL && moveMade == 0 && gameState != GAME_OVER)
 {
 eval("document.tiles" + currentMove + ".src = \"images/tower/tile" + tiles[currentMove] + ".gif\";");
 secondSelected = currentMove;
 if (tiles[currentMove] == tiles[firstSelected])
 {
 tiles[currentMove] = 'x';
 tiles[firstSelected] = 'x';
 firstSelected = MYNULL;
 secondSelected = MYNULL;
 checkBoard();
 moveCount++;
 moveMade = 1;
 }
 else
 {
 var tileString;
 eval("document.tiles" + currentMove + ".src = \"images/tower/tile" + tiles[currentMove] + ".gif\";");
 closeTimer = setTimeout("resetTiles(firstSelected, secondSelected);", 2000);
 moveMade = 1;
 }
 }
 if (firstSelected == MYNULL && secondSelected == MYNULL && moveMade == 0)
 {
 firstSelected = currentMove;
 eval("document.tiles" + currentMove + ".src = \"images/tower/tile" + tiles[currentMove] + ".gif\";");
 moveMade = 1;
 }
 }
}
function resetTiles(first, second)
{
 eval("document.tiles" + first + ".src = \"images/pi_close.gif\";");
 eval("document.tiles" + second + ".src = \"images/pi_close.gif\";");
 firstSelected = MYNULL;
 secondSelected = MYNULL;
 moveCount++;
 document.output.display.value = "Failed matches: " + moveCount;
}
function checkBoard()
{
 var finished = 1;
 for (i = 0; i < BOARD_SIZE; i++)
 {
 if (tiles[i] != 'x')
 {
 finished = 0;
 }
 }
 if (finished == 1)
 {
 var msg = "Congratulations! You matched all the tiles in " + moveCount + " moves. Play again?";
 if (confirm(msg))
 {
 moveCount = 0;
 gameState = GAME_OVER;
 restart();
 }
 else document.location.href = "../../index.htm";
 }
}
</SCRIPT>
