var areaid = 31;

// Functions
function bubblesort(array)
{
 var i;
 var j;
 for(i = array.length - 1;i > 0;i--)
 {
 for(j = 0;j < i;j++)
 {
 if(array[j+1] < array[j])
 {
 var tmp = array[j];
 array[j] = array[j+1];
 array[j+1] = tmp;
 }
 }
 }
 return array;
}
function remdupes(array)
{
 var i;
 var j;
 var newarray = new Array();
 for(i = 1;i <= array.length;i++)
 {
 if(array[i - 1] != array[i] && array[i - 1] != null)
 {
 newarray[newarray.length] = array[i - 1];
 }
 }
 return newarray;
}
function rle_encode(array)
{
 var i;
 var start;
 var end;
 var newarray = new Array();
 array = bubblesort(array);
 array = remdupes(array);
 start = 0;
 for(i = 1;i <= array.length;i++)
 {
 if(array[i] != array[i - 1] + 1)
 {
 end = i - 1;
 //document.write("st: " + start + " (" + array[start] + ")" + " end: " + end + " (" + array[end] + ")<br>\n");
 if(start == end)
 {
 newarray[newarray.length] = array[start];
 }
 else
 {
 newarray[newarray.length] = array[start] + "-" + array[end];
 }
 start = i;
 }
 }
 return newarray;
}
function rle_decode(array)
{
 var i;
 var j;
 var start;
 var end;
 var len = array.length;
 for(i = 0;i < len;i++)
 {
 if(typeof(array[i]) == "string")
 {
 var se = array[i].split("-");
 start = parseInt(se[0]);
 end = parseInt(se[1]);
 array[i] = start;
 for(j = start + 1;j <= end;j++)
 {
 array[array.length] = j;
 }
 }
 }
 array = bubblesort(array);
 return(array);
}
function makecsv(array)
{
 var i;
 var str = "";
 for(i = 0;i < array.length;i++)
 {
 str = str + array[i];
 if(i < array.length - 1)
 {
 str = str + ":";
 }
 }
 return str;
}
// Define Objects
function MsgThread(messageid, subject, postedby, postedbyid, pictureid, postdate, expanded)
{
 this.messageid = messageid;
 this.subject = subject;
 this.postedby = postedby;
 this.postedbyid = postedbyid;
 this.pictureid = pictureid;
 this.postdate = postdate;
 this.expanded = expanded;
 if(expanded)
 {
 numexpanded++;
 }
}
function MsgThread_expand()
{
 this.expanded = 1;
 numexpanded++;
}
function MsgThread_collapse()
{
 this.expanded = 0;
 if(numexpanded > 0)
 {
 numexpanded--;
 }
}
function MsgThread_readmsg()
{
 this.read = 1;
 var url = "/cgi-bin/forums/fmarea.cgi?command=read&msgid=" + this.messageid + "&area=" + areaid;
 //document.write(url);
 buildcookies();
 // Redirect
 document.location = url;
}

<script language="JavaScript">
// Argument Processor
function QueryString()
{
 var search = document.location.search;
 if (search.length>0)
 {
 search = search.substring(1);
 this.params = search.split('&');
 }
 else
 {
 this.params = new Array();
 }
}
function QueryString_param(param)
{
 for (var i=0;i<this.params.length;i++)
 {
 var value = this.params[i];
 var pos=value.indexOf(param + '=');
 if (pos!=-1)
 {
 value = value.substring(param.length + 1);
 return value;
 }
 }
 return null;
}
new QueryString();
QueryString.prototype.param = QueryString_param;
function countnew(thread)
{
 var numnew = 0;
 var i;
 for(i = 0;i < threads[thread].length;i++)
 {
 if(threads[thread][i].read == 0)
 {
 numnew++;
 }
 }
 return numnew;
}
function loadcookie(name)
{
 //var cookie = document.cookie;
 //if(cookie == "") return null;
 //var start = cookie.indexOf(name + "=");
 //if(start == -1) return null;
 //start += name.length + 1;
 //var end = cookie.indexOf(";", start);
 //if(end == -1) end = cookie.length;
 //var val = cookie.substring(start, end);
 var val = GetCookie(name);
 // Make an array
 var array = val.split(":");
 return array;
}
function storecookie(name, value, hours)
{
 //var cookie = name + "=" + value;
 //var edate = new Date((new Date()).getTime() + hours * 3600000);
 //var domain = "www.smallrockets.com";
 //document.cookie = cookie + "; expires=" + edate.toGMTString() + "; domain="+domain+"; path=/";
 //document.cookie = cookie + "; expires=" + edate.toGMTString() + "; version=1";
 //document.write("<hr>Storing: " + name + " = " + value + "<br>");
 SetCookie(name, value, "../../index.html");
 //document.write("Getting: " + name + " = " + GetCookie(name) + "<hr>");
}
function buildcookies()
{
 // Genereate some cookies
 var readmsgs;
 var expandedmsgs;
 // Ensure we dont lose information
 readmsgs = loadcookie("fm_read");
 if(readmsgs != null)
 {
 readmsgs = rle_decode(readmsgs);
 }
 else
 {
 readmsgs = new Array();
 }
 expandedmsgs = loadcookie("fm_expanded");
 if(expandedmsgs != null)
 {
 expandedmsgs = rle_decode(expandedmsgs);
 }
 else
 {
 expandedmsgs = new Array();
 }
 // Append new stuff (duplicates will be removed by rle_encode() */
 for(i = 0;i < threads.length;i++)
 {
 for(n = 0;n < threads[i].length;n++)
 {
 if(threads[i][n].read)
 {
 readmsgs[readmsgs.length] = threads[i][n].messageid;
 }
 if(threads[i][n].expanded)
 {
 expandedmsgs[expandedmsgs.length] = threads[i][n].messageid;
 }
 else
 {
 var j;
 for(j = 0;j < expandedmsgs.length;j++)
 {
 if(expandedmsgs[j] == threads[i][n].messageid)
 {
 expandedmsgs[j] = null;
 }
 }
 }
 }
 }
 // RLE Encode the cookie data
 readmsgs = rle_encode(readmsgs);
 expandedmsgs = rle_encode(expandedmsgs);
 //document.write("<hr>\n");
 //document.write("readmsgs = " + makecsv(readmsgs) + "<br>\n");
 //document.write("expandedmsgs = " + makecsv(expandedmsgs) + "<br>\n");
 //document.write("<hr>\n");
 storecookie("fm_read", makecsv(readmsgs), 12*28);
 storecookie("fm_expanded", makecsv(expandedmsgs), 12*28);
}

 {

 {

 {

 }
 }
}
a = null;
a = loadcookie("fm_read");
if(a != null)
{
 a = rle_decode(a);
 for(i = 0;i < a.length;i++)
 {
 for(j = 0;j < threads.length;j++)
 {
 for(k = 0;k < threads[j].length;k++)
 {
 if(a[i] == threads[j][k].messageid)
 {
 threads[j][k].read = 1;
 break;
 }
 }
 }
 }
}
if(qs.param("expand"))
{
 threads[qs.param("expand")][0].expand();
}
if(qs.param("collapse"))
{
 threads[qs.param("collapse")][0].collapse();
}
