function GetSearchParam(param)
{
 var search = document.location.search;
 search = unescape(search);
var newvalue = "";
for(var n=0;n<search.length;n++)
{
 if(search.substring(n, n+1) != " ")
 {
 newvalue += search.substring(n, n+1);
 }
}
 search = newvalue;
 if (search.length>0)
 {
 search = search.substring(1);
 var params = search.split('&');
 for (var i=0;i<params.length;i++)
 {
 var value = params[i];
 var pos=value.indexOf(param + '=');
 if (pos!=-1)
 {
 value = value.substring(param.length + 1);
 return value;
 }
 }
 }
 return "";
}
function BuyProduct()
{
 var skuName;
 var search = document.location.search;
 if (search.length>0)
 {
 skuName = GetSearchParam('key');
 }
 BasketEmpty();
 BasketAdd(skuName,'Jetboat Superchamps','PC',14.99,'.');
 BasketGotoCheckout();
 return false;
}
