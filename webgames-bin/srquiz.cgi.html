function Question( questionid,question, category)
{
 this.questionid = questionid;
 this.question = question;
 this.category = category;
 this.answerids = new Array();
 this.answers = new Array();
 this.other = new Array();
 this.givenanswer = -1;
 this.display = displayQuestion;
 this.addAnswer = addAnswerQuestion;
 this.setGivenAnswer = setGivenAnswerQuestion;
 this.getGivenAnswer = getGivenAnswerQuestion;
 this.getQuestionID = getQuestionIDQuestion;
 this.getAnswer = getAnswerQuestion;
}
function getGivenAnswerQuestion()
{
 return this.givenanswer;
}
function getQuestionIDQuestion()
{
 return this.questionid;
}
function addAnswerQuestion(answerid,answertext,other)
{
 this.answers[this.answers.length] = answertext;
 this.answerids[this.answerids.length] = answerid;
 this.other[this.other.length] = other;
}
function getAnswerQuestion()
{
 var i;
 for (i=0;i<this.answerids.length+1;i++)
 {
 if (this.other[i] != 0)
 {
 return this.answers[i];
 }
 }
 return "";
}
function setGivenAnswerQuestion(answerid)
{
 var i;
 this.givenanswer = answerid;
 if (answerid<0)
 {
 return 0;
 }
 for (i=0;i<this.answerids.length+1;i++)
 {
 if (this.answerids[i] == answerid)
 {
 return this.other[i];
 }
 }
 return 0;
}
function displayQuestion()

 QUESTION_FRAME.writeln((currentQuestion + 1) + ":");
 QUESTION_FRAME.writeln(this.question + "<P>");
 for (i=0;i<this.answers.length;i++)
 {
 QUESTION_FRAME.writeln("<A HREF=\"/webgames/games/quiz/index.htm\" onClick=\"parent.code.giveAnswer("+this.answerids[i]+"); return false\">" + this.answers[i] + "</A><BR>");
 }
 QUESTION_FRAME.writeln("<P>&nbsp;");
 doFooter();
}

function giveAnswer(choice)
{

 questionTimer = setTimeout("nextQuestion()", 800);

 {
 questionTimer = setTimeout("nextQuestion()", 1600);
 }
 doHeader();
 if (choice<0)
 {
 QUESTION_FRAME.writeln("<CENTER><FONT FACE=\"Verdana, Arial, Helvetica\" SIZE=4><B>"+textOutOfTime+"!");

 {

function nextQuestion()
{
 clearTimeout(questionTimer);
 if (currentQuestion < questionSet.length-1)
 {
 currentQuestion++;
 questionSet[currentQuestion].display();
 }
 else
 {
 var i;
 var answers="";
 for (i=0;i<questionSet.length;i++)
 {
 answers = answers + questionSet[i].getQuestionID() + "," + questionSet[i].getGivenAnswer() + ",";
 }
 if (submitted == 1)
 {
 parent.location.href = "webgames/games/quiz/index.htm";
 }
 else
 {
 submitted = 1;
 doResults();
 }
 }
}
function beginRunning()
{
 initQuestions();
 questionSet[0].display();
}

 {
